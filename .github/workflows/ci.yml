name: CI
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  test:
    name: Python ${{ matrix.python }} / PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported and the version pinned in .tool-versions.
        python: ["3.10", "3.15"]
        postgres: ["16", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: feature_gate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      UV_PYTHON: ${{ matrix.python }}
      FEATURE_GATE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/feature_gate_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version-file: ".tool-versions"
      - name: Run tests
        run: uv run --locked pytest -vv
