[project]
name = "feature_gate"
version = "0.2.0"
description = "An extensible feature flagging library for Python"
authors = [{ name = "Patrick Wiseman", email = "patrick@deft.services" }]
maintainers = [{ name = "Patrick Wiseman", email = "patrick@deft.services" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["feature flags", "feature gate"]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "structlog>=26.1.0",
  "requests>=2.34.2",
]

[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.2",
]

[project.scripts]
feature-gate-migrate = "feature_gate.migrate:main"

[project.urls]
Homepage = "https://github.com/deftinc/feature_gate"
Repository = "https://github.com/deftinc/feature_gate"

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-mock>=3.17.0",
  "psycopg[binary]>=3.2",
]

[tool.uv]
required-version = ">=0.13.5"

[tool.hatch.build.targets.sdist]
include = ["feature_gate", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["feature_gate"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
